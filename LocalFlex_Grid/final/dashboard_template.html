<meta charset="utf-8"><title>LocalFlex Grid Control Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: control-room dashboard. Header with scenario/case/time controls, tabbed panels; feeder schematic left, state tiles right, linked time-series below. */
:root{--bg:#f4f5f6;--panel:#ffffff;--ink:#14181c;--ink2:#4a545e;--mute:#7b8691;--line:#dfe3e7;--accent:#1f5f8b;--good:#1e8e3e;--warn:#c77700;--crit:#c5362f;--A:#2a78d6;--B:#eb6834;--C:#1baf7a;--D:#eda100;--chip:#e9eef2;--shade:#e8eff6;--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1317;--panel:#171c21;--ink:#e8ecef;--ink2:#aab4bd;--mute:#7f8a94;--line:#2a3138;--accent:#6fb1e0;--good:#4cc16a;--warn:#e5a13a;--crit:#ef6a62;--A:#3987e5;--B:#d95926;--C:#199e70;--D:#c98500;--chip:#222a31;--shade:#1d2a36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1317;--panel:#171c21;--ink:#e8ecef;--ink2:#aab4bd;--mute:#7f8a94;--line:#2a3138;--accent:#6fb1e0;--good:#4cc16a;--warn:#e5a13a;--crit:#ef6a62;--A:#3987e5;--B:#d95926;--C:#199e70;--D:#c98500;--chip:#222a31;--shade:#1d2a36;color-scheme:dark}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;padding-inline:16px;padding-block:14px 40px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.1px}h2{font-size:14px;margin:0 0 8px;font-weight:600}h3{font-size:12px;margin:0 0 6px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}.sub{color:var(--ink2);font-size:12.5px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg button{border:0;border-radius:0;background:var(--panel);display:flex;gap:6px;align-items:center}.seg button[aria-pressed=true]{background:var(--chip);font-weight:600}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--ink2)}.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.tile{border:1px solid var(--line);border-radius:6px;padding:8px 10px}.tile b{display:block;font-family:var(--mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}.tile span{color:var(--ink2);font-size:11.5px}
.chip{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11.5px;font-weight:600;background:var(--chip);color:var(--ink2)}.chip.good{color:var(--good)}.chip.warn{color:var(--warn)}.chip.crit{color:var(--crit)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--ink2);font-weight:600;font-size:11.5px}.scroll{overflow-x:auto;max-width:100%}td.l,th.l{text-align:left;white-space:normal}
svg{max-width:100%;height:auto;display:block}svg text{fill:var(--ink2);font-family:var(--sans);font-size:11px}.node{cursor:pointer}.note{color:var(--ink2);font-size:12.5px;max-width:78ch}.mono{font-family:var(--mono)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}.legend span{display:flex;gap:5px;align-items:center}
input[type=range]{width:min(360px,60vw)}.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}.kv dt{color:var(--ink2)}.kv dd{margin:0;font-family:var(--mono)}
</style>
<div class="wrap">
 <div class="top"><div><h1>LocalFlex Grid Control Dashboard</h1><div class="sub">100-home 415 V feeder, OpenDSS twin. Replay of real simulation runs on synthetic profiles (seed 7). Prototype assumptions, no hardware.</div></div>
  <div class="ctl"><button id="theme" type="button">Theme</button></div></div>
 <div class="panel ctl" id="controls">
  <label>Scenario <select id="scn"></select></label>
  <div class="seg" id="cases" role="group" aria-label="Case"></div>
  <label>Time <input type="range" id="k" min="0" max="127" value="68"></label><b class="mono" id="clock"></b><button id="play" type="button">Play</button>
 </div>
 <div class="tabs" role="tablist" id="tabs"></div>
 <div id="view"></div>
</div>
<script>
const D=__DATA__; const CASES=["A","B","C","D"]; const CN={A:"A No control",B:"B Rules",C:"C Network-aware MPC",D:"D MPC + fairness"}; const CV={A:"var(--A)",B:"var(--B)",C:"var(--C)",D:"var(--D)"};
const SCN={clear:"Clear",cloudy:"Cloudy",high_solar:"High solar",high_demand:"High demand"}; const TABS=["Grid","Decision","DISCOM","Results","Robustness","Assumptions"];
const S={scn:"clear",cs:"D",k:68,tab:"Grid",node:"a5",req:null,trace:0,playing:null}; try{const t=location.hash.slice(1);if(TABS.includes(t))S.tab=t}catch(e){}
const $=s=>document.querySelector(s);const E=(h)=>{const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild};const f=(x,n=1)=>x==null||isNaN(x)?"n/a":(+x).toFixed(n);
const ts=()=>D.ts[S.scn+"|"+S.cs]||D.ts[S.scn+"|A"]; const clock=k=>{const t=ts().t[k];const h=Math.floor(t%24),m=Math.round((t%1)*60);return (t>=24?"next day ":"day 2 ")+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")};
// ---------- charts
function line(el,o){const W=640,H=o.h||170,L=44,R=10,T=10,B=24;const t=o.t,x=v=>L+(v-t[0])/(t[t.length-1]-t[0])*(W-L-R);let lo=o.lo,hi=o.hi;if(lo==null||hi==null){let a=1e9,b=-1e9;o.series.forEach(s=>s.y.forEach(v=>{a=Math.min(a,v);b=Math.max(b,v)}));lo=o.lo??a;hi=o.hi??b;if(hi-lo<1e-9){hi=lo+1}}const y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.title}">`;
 const nt=4;for(let i=0;i<=nt;i++){const v=lo+(hi-lo)*i/nt;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${y(v)+3}" text-anchor="end">${(+v).toFixed(o.dp??1)}</text>`}
 for(let h=0;h<=32;h+=4){g+=`<text x="${x(h)}" y="${H-7}" text-anchor="middle">${String(h%24).padStart(2,"0")}h</text>`}
 (o.bands||[]).forEach(b=>{g+=`<rect x="${x(b[0])}" width="${x(b[1])-x(b[0])}" y="${T}" height="${H-T-B}" fill="var(--shade)" opacity=".8"/>`});
 (o.hl||[]).forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--mute)" stroke-dasharray="4 3"/>`});
 o.series.forEach(s=>{g+=`<polyline fill="none" stroke="${s.c}" stroke-width="${s.w||1.6}" opacity="${s.op||1}" points="${s.y.map((v,i)=>x(t[i]).toFixed(1)+","+y(v).toFixed(1)).join(" ")}"/>`});
 if(o.k!=null){g+=`<line x1="${x(t[o.k])}" x2="${x(t[o.k])}" y1="${T}" y2="${H-B}" stroke="var(--ink)" stroke-width="1"/>`}
 g+=`<text x="${L}" y="9" style="fill:var(--ink)">${o.title}</text></svg>`;el.innerHTML=g}
function box(title,id,extra=""){return `<div class="panel"><h3>${title}</h3><div id="${id}"></div>${extra}</div>`}
// ---------- feeder
const MAP={a2:["WH1 (ph C)"],a3:["PUMP1 (ph A)"],a4:["WH2 (ph A)","Battery"],a5:["EV1 (ph A)"],b2:["PUMP2 (ph C)"],b3:["WH3 (ph B)"],b4:["EV2 (ph B)"],b5:["WH4 (ph A)"]};
function feeder(){const d=ts(),k=S.k;let g=`<svg viewBox="0 0 640 270" role="img" aria-label="Feeder schematic with voltage status">`;const px=i=>150+i*92;
 g+=`<rect x="14" y="108" width="54" height="54" rx="4" fill="var(--chip)" stroke="var(--line)"/><text x="41" y="132" text-anchor="middle" style="fill:var(--ink);font-weight:600">250 kVA</text><text x="41" y="146" text-anchor="middle">${f(d.trafo_pct[k],0)}%</text>`;
 [[70,"F1"],[200,"F2"]].forEach(([yy,nm],fi)=>{g+=`<path d="M68 135 H100 V${yy} H${px(0)}" fill="none" stroke="var(--mute)" stroke-width="2"/><line x1="${px(0)}" x2="${px(4)}" y1="${yy}" y2="${yy}" stroke="var(--mute)" stroke-width="2"/><text x="${px(0)-40}" y="${yy-8}">${nm}</text>`;
  for(let i=0;i<5;i++){const n=D.nodes[fi*5+i];const v=d.V[fi*5+i].map(a=>a[k]);const lo=Math.min(...v),hi=Math.max(...v);const st=lo<0.94?"var(--crit)":hi>1.06?"var(--warn)":"var(--good)";const sel=S.node===n;
   g+=`<g class="node" data-n="${n}" tabindex="0" role="button" aria-label="${n}"><circle cx="${px(i)}" cy="${yy}" r="${sel?17:14}" fill="${st}" stroke="${sel?"var(--ink)":"var(--panel)"}" stroke-width="2.5"/><text x="${px(i)}" y="${yy+4}" text-anchor="middle" style="fill:#fff;font-weight:600">${n}</text><text x="${px(i)}" y="${yy+31}" text-anchor="middle" class="mono">${lo.toFixed(3)}</text>`;
   if(hi>lo+0.0005&&(hi>1.06)) g+=`<text x="${px(i)}" y="${yy-21}" text-anchor="middle" class="mono">${hi.toFixed(3)}</text>`;g+=`</g>`}});
 g+=`<text x="14" y="258">Node colour: lowest phase below 0.94 pu red, highest above 1.06 pu amber, otherwise green. Number = lowest phase voltage (pu).</text></svg>`;return g}
function nodeInfo(){const d=ts(),k=S.k,i=D.nodes.indexOf(S.node);const v=d.V[i].map(a=>a[k]);const dv=d.dev;const items=(MAP[S.node]||[]);let rows="";items.forEach(it=>{const id=it.startsWith("Battery")?"BATT":it.split(" ")[0];rows+=`<tr><td>${it}</td><td>${f(dv[id]?dv[id][k]:null,2)} kW</td></tr>`});
 return `<h3>Bus ${S.node}</h3><div class="kv"><dt>Phase A</dt><dd>${f(v[0],3)} pu</dd><dt>Phase B</dt><dd>${f(v[1],3)} pu</dd><dt>Phase C</dt><dd>${f(v[2],3)} pu</dd></div><div class="scroll"><table><tbody>${rows||"<tr><td>No flexible resource at this bus</td><td></td></tr>"}</tbody></table></div>`}
function kpis(){const d=ts(),k=S.k;const vmin=Math.min(...d.V.flat().map(a=>a[k])),vmax=Math.max(...d.V.flat().map(a=>a[k]));const vs=vmin<0.94?`<span class="chip crit">under-voltage</span>`:vmax>1.06?`<span class="chip warn">over-voltage</span>`:`<span class="chip good">in band</span>`;
 const b=d.dev.BATT[k];const T=(l,v,u)=>`<div class="tile"><span>${l}</span><b>${v}</b><span>${u}</span></div>`;
 return `<div class="tiles">${T("PV available",f(d.pv_avail[k]),"kW")}${T("PV delivered",f(d.pv[k]),"kW")}${T("PV curtailed",f(d.pv_curt[k]),"kW")}${T("Demand incl. devices",f(d.demand[k]),"kW")}${T("Transformer",f(d.trafo_kW[k]),"kW, + import")}${T("Loading",f(d.trafo_pct[k],0),"% of 250 kVA")}${T("Neutral current",f(d.In[k],0),"A, limit 100")}${T("Battery",(b>=0?"+":"")+f(b),"kW, + charging")}${T("Battery SoC",f(d.soc[k],0),"%")}</div><p class="note">Voltage ${vs} lowest ${f(vmin,3)} pu, highest ${f(vmax,3)} pu. Neutral current is ${f(d.In[k],0)} A against the assumed 100 A ampacity${d.In[k]>100?" (exceeded)":""}.</p>`}
function devs(){const d=ts(),k=S.k;let r="";Object.keys(d.dev).filter(x=>x!="BATT").forEach(id=>{const ex=id.startsWith("EV")?`${f(d.ev_rem[id][k],1)} kWh still to charge`:id.startsWith("WH")?`${f(d.T[id][k],0)} °C`:`tank ${f(d.lvl[id][k],0)} %`;r+=`<tr><td>${id}</td><td>${f(d.dev[id][k],2)} kW</td><td class="l">${ex}</td></tr>`});return `<div class="scroll"><table><thead><tr><th>Group</th><th>Power</th><th class="l">State</th></tr></thead><tbody>${r}</tbody></table></div>`}
function compare(){const k=S.k;let r="";CASES.forEach(c=>{const d=D.ts[S.scn+"|"+c];if(!d)return;const lo=Math.min(...d.V.flat().map(a=>a[k])),hi=Math.max(...d.V.flat().map(a=>a[k]));r+=`<tr><td><span class="dot" style="background:${CV[c]}"></span> ${CN[c]}</td><td>${lo.toFixed(3)}</td><td>${hi.toFixed(3)}</td><td>${f(d.trafo_pct[k],0)}</td><td>${f(d.pv_curt[k])}</td><td>${f(d.dev.BATT[k])}</td></tr>`});return `<div class="scroll"><table><thead><tr><th>Case at this time</th><th>V min pu</th><th>V max pu</th><th>Trafo %</th><th>Curtailed kW</th><th>Battery kW</th></tr></thead><tbody>${r}</tbody></table></div>`}
function gridTab(){$("#view").innerHTML=`<div class="grid2"><div class="panel"><h3>Feeder, ${CN[S.cs]}</h3>${feeder()}<div id="ninfo" style="margin-top:8px">${nodeInfo()}</div></div><div class="panel"><h3>State at ${clock(S.k)}</h3>${kpis()}</div></div>
 <div class="grid2"><div class="panel"><h3>Case comparison at the selected time</h3>${compare()}</div><div class="panel"><h3>Flexible resources, ${CN[S.cs]}</h3>${devs()}</div></div>
 <div class="legend">${CASES.map(c=>`<span><i class="dot" style="background:${CV[c]}"></i>${CN[c]}</span>`).join("")}<span>Selected case drawn thicker. Vertical line = time slider. Shaded = 18:00-22:00 evening peak.</span></div>
 <div class="grid3">${box("Lowest phase voltage","c1")}${box("Highest phase voltage","c2")}${box("Transformer net power","c3")}${box("Neutral current","c4")}${box("PV curtailed","c5")}${box("Battery state of charge","c6")}</div>`;
 document.querySelectorAll(".node").forEach(n=>{const go=()=>{S.node=n.dataset.n;render()};n.onclick=go;n.onkeydown=e=>{if(e.key==="Enter"||e.key===" ")go()}});charts()}
function charts(){const mk=(fn)=>CASES.filter(c=>D.ts[S.scn+"|"+c]).map(c=>{const d=D.ts[S.scn+"|"+c];return {c:CV[c],y:fn(d),w:c===S.cs?2.6:1.2,op:c===S.cs?1:.65}});const t=ts().t,common={t,k:S.k,bands:[[18,22],[42,46]].filter(b=>b[1]<=32.1)};const ev=[[18,22]];
 line($("#c1"),{...common,title:"pu",bands:ev,series:mk(d=>d.V[0].map((_,i)=>Math.min(...d.V.map(a=>a[i][0]===undefined?9:Math.min(...a.map(z=>z[i])))))),hl:[0.94],dp:2,lo:0.82,hi:1.02});
 line($("#c2"),{...common,title:"pu",bands:ev,series:mk(d=>d.V[0][0].map((_,i)=>Math.max(...d.V.map(a=>Math.max(...a.map(z=>z[i])))))),hl:[1.06],dp:3});
 line($("#c3"),{...common,title:"kW",bands:ev,series:mk(d=>d.trafo_kW),hl:[0],dp:0});line($("#c4"),{...common,title:"A (limit 100 A)",bands:ev,series:mk(d=>d.In),hl:[100],dp:0,lo:0});line($("#c5"),{...common,title:"kW",bands:ev,series:mk(d=>d.pv_curt),dp:0,lo:0});line($("#c6"),{...common,title:"%",bands:ev,series:mk(d=>d.soc),dp:0,lo:0,hi:100})}
// ---------- decision
function decisionTab(){const tr=D.traces.filter(t=>t.controller===(S.cs==="C"?"C":"D"));if(!tr.length){$("#view").innerHTML=`<div class="panel">No decision trace in this build.</div>`;return}if(S.trace>=tr.length)S.trace=0;const t=tr[S.trace];const cand=[...t.candidates].sort((a,b)=>a.predicted_dV_at_node-b.predicted_dV_at_node);const mx=Math.max(...cand.map(c=>Math.abs(c.predicted_dV_at_node)),1e-9);
 const sel=tr.map((x,i)=>`<option value="${i}" ${i===S.trace?"selected":""}>${String(Math.floor(x.hour)).padStart(2,"0")}:00 ${x.regime}</option>`).join("");
 let rows=cand.map(c=>`<tr><td>${c.resource}</td><td>${c.bus_phase}</td><td>${c.H_pu_per_kW.toExponential(2)}</td><td>${f(c.natural_kW,2)}</td><td>${f(c.planned_kW,2)}</td><td>${(c.predicted_dV_at_node*1000).toFixed(2)}</td><td style="width:140px"><div style="height:8px;border-radius:2px;background:${c.predicted_dV_at_node<0?"var(--C)":"var(--B)"};width:${Math.abs(c.predicted_dV_at_node)/mx*100}%"></div></td></tr>`).join("");
 $("#view").innerHTML=`<div class="panel"><div class="ctl"><h2 style="margin:0">Why did the controller act at ${String(Math.floor(t.hour)).padStart(2,"0")}:00?</h2><label>Decision <select id="tsel">${sel}</select></label></div>
 <p class="note">Problem: <b>${t.constraint}</b> forecast at bus/phase <b>${t.node_phase}</b>, ${f(t.V_forecast_no_action,4)} pu with no action. The planner uses the OpenDSS-derived sensitivity of that bus/phase to every resource (${t.regime} matrix) and chooses how much each resource moves away from its natural behaviour.</p>
 <div class="scroll"><table><thead><tr><th>Resource</th><th>Bus/phase</th><th>Sensitivity pu per kW</th><th>Natural kW</th><th>Planned kW</th><th>Predicted change at ${t.node_phase} (mpu)</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
 <div class="tiles" style="margin-top:12px"><div class="tile"><span>Forecast, no action</span><b>${f(t.V_forecast_no_action,4)}</b><span>pu</span></div><div class="tile"><span>Predicted with plan</span><b>${f(t.V_pred_with_action,4)}</b><span>pu</span></div><div class="tile"><span>OpenDSS after execution</span><b>${f(t.V_OpenDSS_after_execution,4)}</b><span>pu</span></div><div class="tile"><span>OpenDSS, no control (A)</span><b>${f(t.V_OpenDSS_no_control_A,4)}</b><span>pu</span></div></div>
 <p class="note">Validator: ${t.validator}. The OpenDSS number is the nonlinear result with all four effects acting together (actual forecast error, inverter volt-watt, every resource at once), so it can differ from the planner's linear prediction.</p></div>
 <div class="panel"><h3>How good is the sensitivity prediction?</h3><div class="scroll"><table><thead><tr><th>Controller</th><th>RMSE with planned action (pu)</th><th>RMSE forecast only (pu)</th><th>Steps</th></tr></thead><tbody>${(D.rmse||[]).map(r=>`<tr><td>${r.controller}</td><td>${r.rmse_pred_vs_opendss_pu}</td><td>${r.rmse_forecast_base_no_action_pu}</td><td>${r.steps}</td></tr>`).join("")}</tbody></table></div><p class="note">Root-mean-square gap between predicted and OpenDSS voltage over all 30 bus/phase positions on the reported day, using the planner's first step each time.</p></div>`;$("#tsel").onchange=e=>{S.trace=+e.target.value;render()}}
// ---------- DISCOM
function discomTab(){const names=Object.keys(D.dispatch);if(!names.length){$("#view").innerHTML=`<div class="panel">Run final/dispatch.py to add the dispatch replay.</div>`;return}if(!S.req||!D.dispatch[S.req])S.req=names[0];const q=D.dispatch[S.req],rs=q.response,rt=D.dispatch_tab.find(r=>r.request===S.req)||{};const st=rt.verified_status||rs.status;const cl=st==="accepted"?"good":st==="partial"?"warn":"crit";
 const msgs=(q.comm_log||[]).filter((m,i)=>i<40).map(m=>`<tr><td>${m.step}</td><td class="l">${m.dir}</td><td class="l mono">${typeof m.msg==="string"?m.msg:JSON.stringify(m.msg).slice(0,150)}</td></tr>`).join("");
 $("#view").innerHTML=`<div class="grid2"><div class="panel"><div class="ctl"><h2 style="margin:0">DISCOM view, aggregated data only</h2><label>Request <select id="rsel">${names.map(n=>`<option ${n===S.req?"selected":""}>${n}</option>`).join("")}</select></label></div>
 <p class="note">Replay of a real run: the simulated DISCOM sends a request one hour before its window. LocalFlex checks feasibility with its own planner, answers, then executes through MPC, validator and devices. Run <span class="mono">python run_demo.py</span> to send a new request live.</p>
 <div class="tiles"><div class="tile"><span>Request</span><b class="chip ${cl}">${st}</b><span>planner said: ${rt.planner_status||rs.status}</span></div><div class="tile"><span>Requested</span><b>${f(rt.check_requested,0)}</b><span>kW (${rt.check_metric||""})</span></div><div class="tile"><span>Achieved in simulation</span><b>${f(rt.check_achieved,1)}</b><span>kW, OpenDSS outcome</span></div><div class="tile"><span>Request met</span><b>${rt.check_met?"yes":"no"}</b><span>within 10 % / 5 %</span></div></div>
 <p class="note"><b>Reason:</b> ${rt.verified_reason||rs.reason}</p><div id="dc"></div></div>
 <div class="panel"><h3>Messages (no household data)</h3><p class="note">Link-down periods drop messages in both directions. LocalFlex keeps its last valid request until it expires, local rules and hard-limit protection stay active, and the log below shows what was lost.</p><div class="scroll" style="max-height:340px;overflow-y:auto"><table><thead><tr><th>Step</th><th class="l">Direction</th><th class="l">Content</th></tr></thead><tbody>${msgs}</tbody></table></div></div></div>`;
 const t=ts().t;line($("#dc"),{t:D.ts["clear|D"].t,k:null,title:"Transformer net power, kW (grey = baseline D, amber = with request)",bands:[q.window],series:[{c:"var(--mute)",y:q.import_baseline,w:1.6},{c:"var(--D)",y:q.import_run,w:2.2}],dp:0,hl:[0],h:200});$("#rsel").onchange=e=>{S.req=e.target.value;render()}}
// ---------- results & robustness
const MET=[["hours_any_undervoltage","Hours with any under-voltage","h"],["hours_any_overvoltage","Hours with any over-voltage","h"],["under_pu_h","Under-voltage magnitude","pu·h"],["over_pu_h","Over-voltage magnitude","pu·h"],["v_min_pu","Lowest voltage","pu"],["v_max_pu","Highest voltage","pu"],["phase_voltage_unbalance_pct_max","Max phase-voltage unbalance","%"],["peak_phase_loading_pct","Peak phase current loading","%"],["peak_neutral_loading_pct","Peak neutral loading","%"],["peak_trafo_loading_pct","Transformer peak loading","%"],["reverse_flow_hours","Reverse-flow hours","h"],["reverse_flow_energy_kWh","Reverse-flow energy","kWh"],["peak_import_kW","Peak import","kW"],["peak_export_kW","Peak export","kW"],["feeder_losses_kWh","Feeder losses","kWh"],["pv_available_kWh","PV available","kWh"],["pv_curtailed_kWh","PV curtailed","kWh"],["curtailment_pct","PV curtailed share","%"],["ev_unmet_at_departure_kWh","EV energy unmet","kWh"],["min_heater_T_C","Lowest heater temperature","°C"],["unmet_water_m3","Unmet water","m³"],["batt_charge_kWh","Battery charge","kWh"],["batt_discharge_kWh","Battery discharge","kWh"],["batt_final_soc_pct","Battery final SoC","%"],["fallbacks_to_rules","Validator fallbacks to rules","steps"],["mip_time_limited_plans","Plans stopped at solver time limit","plans"]];
function resultsTab(){const rows=MET.map(([k,l,u])=>`<tr><td>${l} <span class="sub">${u}</span></td>${CASES.map(c=>{const r=D.comp.find(x=>x.scenario===S.scn&&x.variant===c);return `<td>${r&&r[k]!=null?f(r[k],k.includes("pu")||k.startsWith("v_")?3:2):"n/a"}</td>`}).join("")}</tr>`).join("");
 const fr=(D.fair||[]).filter(x=>x.scenario===S.scn);const concl=D.conclusions.filter(l=>l.startsWith("["+S.scn+"]"));
 $("#view").innerHTML=`<div class="panel"><h2>Final A/B/C/D, ${SCN[S.scn]}: mean of 4 seeds</h2><div class="scroll"><table><thead><tr><th>Metric</th>${CASES.map(c=>`<th><span class="dot" style="background:${CV[c]}"></span> ${CN[c]}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div><p class="note">Identical network, weather, demand, seed, battery state (50 %) and device state for all four cases. Window: reported day plus the next morning until 08:00. Synthetic profiles.</p></div>
 <div class="grid2"><div class="panel"><h3>Fairness (household heater and EV groups)</h3><div class="scroll"><table><thead><tr><th>Case</th><th>Worst burden</th><th>Mean burden</th><th>Jain index</th></tr></thead><tbody>${fr.map(r=>`<tr><td>${CN[r.variant]}</td><td>${r.worst_burden}</td><td>${r.mean_burden}</td><td>${r.fairness_index_jain}</td></tr>`).join("")}</tbody></table></div><p class="note">Burden = delay energy-hours normalised by natural daily energy plus 10 × unmet share. Lower worst burden and a Jain index nearer 1 mean more even sharing.</p></div>
 <div class="panel"><h3>Generated comparison (facts only)</h3>${concl.map(l=>`<p class="note">${l.replace("["+S.scn+"] ","")}</p>`).join("")}</div></div>`}
function tbl(rows,cols,names){if(!rows||!rows.length)return `<p class="note">Not run in this build.</p>`;cols=cols||Object.keys(rows[0]);return `<div class="scroll"><table><thead><tr>${cols.map((c,i)=>`<th class="${i? "":"l"}">${(names&&names[i])||c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map((c,i)=>`<td class="${typeof r[c]==="string"&&r[c].length>20?"l":""}">${r[c]==null?"":typeof r[c]==="number"?+(+r[c]).toFixed(3):r[c]}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function robustTab(){const s=D.studies;const P=(t,n,h)=>`<div class="panel"><h2>${t}</h2><p class="note">${n}</p>${h}</div>`;const base=["variant","tag","hours_any_undervoltage","under_pu_h","peak_trafo_loading_pct","peak_neutral_loading_pct","curtailment_pct","ev_unmet_at_departure_kWh","fallbacks_to_rules"];
 $("#view").innerHTML=P("Fault injection: fallback ladder","Faults injected 16:00-19:00 with controller D. Safety = hard equipment limits respected and voltage violation magnitude in the window no worse than the worse of A and B.",tbl(s.faults,["variant","win_under_pu_h","win_trafo_max_pct","win_neutral_max_A","events","fallbacks_to_rules","ev_unmet_kWh","hard_limits_ok","safety_maintained","event_summary"]))+P("Participation 30 / 60 / 100 %","Share of heater units and EV vehicles under LocalFlex control; the rest stay natural. 100 % is the main A/B/C/D result.",tbl(s.participation,["tag",...base.slice(0,1),...base.slice(2)]))+P("Forecast error","Forecast sigma scaled; 15 % PV / 8 % demand is the reference.",tbl(s.forecast_error,["tag","variant","pv_sigma_pct",...base.slice(2)]))+P("Communication delay in 15-minute steps","Measurement delay (m) and command delay (c). Delays of seconds are below the 15-minute planning and 1-minute device resolution of this model.",tbl(s.comm_delay,["tag","variant",...base.slice(2)]))+P("Battery size and requirement check","Requirements fixed before the runs: voltage violation at most half of no-control, transformer peak within 100 % and not above A, EV unmet at most 1 kWh and no unmet water, curtailment at most 5 %, 17:00 reserve at least 40 % of capacity.",tbl(s.battery_req,["scenario","variant","battery_only","batt_kwh","batt_kw","Q1_voltage","Q2_transformer","Q3_service","Q4_curtail","Q5_reserve","all_met"]))+P("Battery location","Same battery at different buses; sensitivity columns come from OpenDSS.",tbl(s.battery_loc,["tag","batt_node","batt_dV_per_kW_mean","batt_dV_per_kW_far_ends",...base.slice(2)]))+P("Assumption sensitivity","Network and limit assumptions varied, controllers not retuned, all four cases run.",tbl(s.assumptions,["tag","variant",...base.slice(2)]))+P("Scalability","Homes, devices, battery and transformer scaled together; planner size grows with the number of controlled groups.",tbl(s.scale,["tag","variant","homes","run_s","mean_solve_s","planner_vars","planner_cons"]))}
function assumpTab(){const v=D.validation||[];const pass=v.filter(x=>x.passed===true).length;const au=D.audit.map(a=>`<tr><td class="l">${a.item}</td><td class="l"><span class="chip ${a.status==="VERIFIED"?"good":a.status==="PARTIAL"?"warn":"crit"}">${a.status}</span></td><td class="l">${a.finding}</td></tr>`).join("");
 let cost="";if(D.cost){const c=D.cost,L=c.localflex_new_100kWh_50kW;const rw=(n,x)=>x?`<tr><td class="l">${n}</td><td>${Math.round(x.total_capex).toLocaleString("en-IN")}</td><td>${Math.round(x.annual_cost).toLocaleString("en-IN")}</td><td>${Math.round(x.cost_per_household_per_year).toLocaleString("en-IN")}</td></tr>`:"";cost=`<div class="panel"><h2>Cost model (placeholder inputs, INR)</h2><p class="note">Every unit cost is an assumption to be replaced by quotes. ${c.battery_only_size_note||""}</p><div class="scroll"><table><thead><tr><th class="l">Option</th><th>Capex</th><th>Annual cost</th><th>Per household per year</th></tr></thead><tbody>${rw("LocalFlex, new 100 kWh / 50 kW battery + switches + comms",L)}${rw("LocalFlex with second-life battery (133 kWh nominal)",c.localflex_second_life_133kWh_nominal)}${rw("Battery-only at size above",c.battery_only_cost_at_size)}${rw("Transformer upgrade 250 to 400 kVA",c.transformer_upgrade_250_to_400kVA)}</tbody></table></div></div>`}
 $("#view").innerHTML=`<div class="panel"><h2>Acceptance checks <span class="chip ${pass===v.length-1&&v.length?"good":"warn"}">${v.length?pass+" of "+(v.length-1)+" passed":"not run"}</span></h2>${v.filter(x=>x.check).map(x=>`<div class="note"><span class="chip ${x.passed?"good":"crit"}">${x.passed?"PASS":"FAIL"}</span> ${x.check} <span class="mono">${x.detail||""}</span></div>`).join("")}</div>${cost}<div class="panel"><h2>Standards and assumptions audit</h2><div class="scroll"><table><thead><tr><th class="l">Item</th><th class="l">Status</th><th class="l">Finding</th></tr></thead><tbody>${au}</tbody></table></div></div><div class="panel"><h3>Run reference</h3><p class="note mono">${D.manifest.final_reference||""} config ${D.manifest.config_hash||""} · ${(D.manifest.versions||{}).opendssdirect?"OpenDSSDirect "+D.manifest.versions.opendssdirect:""}</p></div>`}

function render(){$("#clock").textContent=clock(S.k);$("#cases").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===S.cs));$("#tabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===S.tab));$("#controls").hidden=!(S.tab==="Grid"||S.tab==="Results"||S.tab==="Decision");
 ({Grid:gridTab,Decision:decisionTab,DISCOM:discomTab,Results:resultsTab,Robustness:robustTab,Assumptions:assumpTab})[S.tab]()}
$("#scn").innerHTML=Object.keys(SCN).map(k=>`<option value="${k}">${SCN[k]}</option>`).join("");$("#scn").onchange=e=>{S.scn=e.target.value;render()};
$("#cases").innerHTML=CASES.map(c=>`<button type="button" data-c="${c}" aria-pressed="false"><i class="dot" style="background:${CV[c]}"></i>${c}</button>`).join("");$("#cases").onclick=e=>{const b=e.target.closest("button");if(b){S.cs=b.dataset.c;render()}};
$("#tabs").innerHTML=TABS.map(t=>`<button type="button" role="tab" data-t="${t}" aria-selected="false">${t}</button>`).join("");$("#tabs").onclick=e=>{const b=e.target.closest("button");if(b){S.tab=b.dataset.t;render()}};
$("#k").oninput=e=>{S.k=+e.target.value;if(S.tab==="Grid")gridTab();$("#clock").textContent=clock(S.k)};$("#play").onclick=()=>{if(S.playing){clearInterval(S.playing);S.playing=null;$("#play").textContent="Play";return}$("#play").textContent="Pause";S.playing=setInterval(()=>{S.k=(S.k+1)%128;$("#k").value=S.k;if(S.tab==="Grid")gridTab();$("#clock").textContent=clock(S.k)},350)};
$("#theme").onclick=()=>{const r=document.documentElement;const d=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);r.setAttribute("data-theme",d?"light":"dark")};
$("#k").value=S.k;render();
</script>
